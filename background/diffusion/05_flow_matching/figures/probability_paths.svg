<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Probability path e campo di velocità nel Flow Matching</title>
  <desc id="desc">Diverse coppie di campioni collegano la distribuzione base alla distribuzione dati. Le velocità condizionali vengono aggregate dal modello in un campo marginale.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 27px sans-serif; fill: #0f172a; }
      .subtitle { font: 600 20px sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 15px sans-serif; fill: #475569; text-anchor: middle; }
      .base { fill: #c4b5fd; stroke: #7c3aed; stroke-width: 2; }
      .data { fill: #93c5fd; stroke: #2563eb; stroke-width: 2; }
      .path { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .field { stroke: #16a34a; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>

  <text class="title" x="35" y="45">Dai path condizionali al campo marginale</text>
  <line class="divider" x1="600" y1="75" x2="600" y2="470"/>
  <text class="subtitle" x="300" y="95">Path condizionali tra coppie</text>
  <text class="subtitle" x="900" y="95">Campo appreso dal modello</text>

  <circle class="base" cx="105" cy="180" r="14"/>
  <circle class="base" cx="115" cy="290" r="14"/>
  <circle class="base" cx="95" cy="400" r="14"/>
  <circle class="data" cx="510" cy="150" r="14"/>
  <circle class="data" cx="520" cy="285" r="14"/>
  <circle class="data" cx="500" cy="420" r="14"/>

  <path class="path" d="M120 180 C240 175 355 155 495 150"/>
  <path class="path" d="M130 290 C250 245 375 330 505 285"/>
  <path class="path" d="M110 400 C245 390 365 410 485 420"/>
  <text class="small" x="105" y="450">p_base</text>
  <text class="small" x="505" y="450">p_data</text>

  <circle class="base" cx="675" cy="180" r="10"/>
  <circle class="base" cx="680" cy="300" r="10"/>
  <circle class="base" cx="700" cy="405" r="10"/>
  <circle class="data" cx="1110" cy="155" r="10"/>
  <circle class="data" cx="1090" cy="290" r="10"/>
  <circle class="data" cx="1115" cy="410" r="10"/>

  <line class="field" x1="740" y1="165" x2="805" y2="153"/>
  <line class="field" x1="735" y1="245" x2="800" y2="230"/>
  <line class="field" x1="745" y1="335" x2="812" y2="340"/>
  <line class="field" x1="835" y1="145" x2="905" y2="150"/>
  <line class="field" x1="830" y1="225" x2="900" y2="245"/>
  <line class="field" x1="840" y1="340" x2="910" y2="330"/>
  <line class="field" x1="930" y1="155" x2="1000" y2="158"/>
  <line class="field" x1="925" y1="255" x2="995" y2="285"/>
  <line class="field" x1="935" y1="330" x2="1005" y2="365"/>
  <text class="small" x="895" y="455">vθ(xₜ, t) trasporta l'intera densità</text>
</svg>
